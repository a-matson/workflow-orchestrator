name: Cache cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete PR caches
    runs-on: ubuntu-latest
    steps:
      # Each PR saves its own caches under refs/pull/N/merge; they are unreachable once it closes
      # and otherwise crowd main's caches out of the repository's 10 GB quota.
      - name: Delete caches for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "$BRANCH" --limit 100 --json id --jq '.[].id' |
            while read -r id; do
              gh cache delete "$id"
            done
