name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Runs on main are never cancelled so every merge keeps its scan record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.29.0

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # No module cache: each gate run resolves and verifies dependencies fresh.
          cache: false
      - name: govulncheck
        working-directory: backend
        # -format json exits 0 on findings; the gate script decides pass/fail.
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... > "$RUNNER_TEMP/govulncheck.json"
      - name: Gate on reachable findings
        run: scripts/govulncheck-gate.sh "$RUNNER_TEMP/govulncheck.json"

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: v0.74.0
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          push: false
          tags: fluxor-backend:scan
          # Read-only: only trusted main runs write scope=backend, and base images are re-resolved.
          cache-from: type=gha,scope=backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          version: v0.74.0
          image-ref: fluxor-backend:scan
          severity: HIGH,CRITICAL
          # A CVE with no fixed version gives a PR nothing to change, so it must not block unrelated work.
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gosec:
    # Fork PRs get a read-only token, so the SARIF upload would fail there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: gosec
        working-directory: backend
        # A gate: any finding fails the job. Excuse a false positive in place with
        # `#nosec Gxxx -- reason`, so the reason sits next to the code.
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -fmt sarif -out gosec.sarif ./...
      # Uploaded even when the gate fails, so the findings show in code scanning.
      - if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: backend/gosec.sarif
          category: gosec

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          min-severity: medium
          # Annotations instead of SARIF: needs no security-events write, so fork PRs run it too.
          advanced-security: false
          annotations: true
