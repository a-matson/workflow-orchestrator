name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Runs on main are never cancelled so every merge keeps its scan record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.29.0

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # Cache off: a poisoned cache must not influence a security gate.
          cache: false
      - name: govulncheck
        working-directory: backend
        # -format json exits 0 on findings; the gate script decides pass/fail.
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... > "$RUNNER_TEMP/govulncheck.json"
      - name: Gate on reachable findings
        run: scripts/govulncheck-gate.sh "$RUNNER_TEMP/govulncheck.json"

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Dockerfiles and compose files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          push: false
          tags: fluxor-backend:scan
          cache-from: type=gha,scope=backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: fluxor-backend:scan
          severity: HIGH,CRITICAL
          # Unfixed CVEs (docker/docker, see .govulncheck-allow) cannot be acted on.
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gosec:
    # Fork PRs get a read-only token, so the SARIF upload would fail there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: gosec (report only)
        working-directory: backend
        # Non-blocking on purpose; plan row S13 makes it a gate once findings are triaged.
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: backend/gosec.sarif
          category: gosec
