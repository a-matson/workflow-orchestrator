name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  # Don't cancel runs on main—they publish images and must complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Workflow lint ─────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by digest and run as a container so the job needs no Go toolchain or module cache.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-commit-msg.sh

  compose-check:
    name: Compose Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-compose.sh
      - run: scripts/check-observability.sh

  # ── Detect Changes ────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      e2e-ui: ${{ steps.filter.outputs.e2e-ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose*.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'nginx*.conf'
              - 'Makefile'
              - 'scripts/**'
              - 'examples/**'
              - '.github/workflows/ci.yml'
            e2e-ui:
              - 'e2e-ui/**'

  # ── Examples: validate JSON ───────────────────────────────────
  examples:
    name: Example Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate example JSON
        run: jq empty examples/*.json

  # ── End-to-end: full compose stack ────────────────────────────
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # Backend owns the Go cache; a second writer under the same key left main with a modules-only entry.
          cache: false

      # On Linux the socket belongs to the docker group, not root (see docker-compose.yml).
      - name: Run make e2e
        run: |
          DOCKER_SOCKET_GID="$(stat -c %g /var/run/docker.sock)"
          export DOCKER_SOCKET_GID
          make e2e

  # ── End-to-end UI: Playwright against the same stack ──────────
  e2e-ui:
    name: E2E UI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.e2e-ui == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e-ui/package-lock.json

      # The runner lacks Chromium's system libraries; --with-deps installs them via sudo, so it stays out of make e2e-ui.
      - name: Install Chromium
        working-directory: e2e-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run make e2e-ui
        run: |
          DOCKER_SOCKET_GID="$(stat -c %g /var/run/docker.sock)"
          export DOCKER_SOCKET_GID
          make e2e-ui

      # Traces record the typed API key, but make e2e-ui mints it per run and the stack is gone by now.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e-ui/playwright-report/
            e2e-ui/test-results/
          retention-days: 7

  # ── Backend: test + lint ──────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_test
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify modules
        run: go mod verify

      # Runs the untagged unit tests too; testutil migrates each test database itself.
      - name: Run integration tests
        run: go test ./... -tags=integration -race -count=1 -coverprofile=coverage.out
        env:
          FLUXOR_IT: "1"
          POSTGRES_URL: postgres://workflow:workflow@localhost:5432/workflow_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      # The integration run is a superset of the unit run, so its profile is the ratchet number.
      - name: Coverage ratchet
        run: ../scripts/coverage-ratchet.sh backend "$(go tool cover -func=coverage.out | awk 'END{gsub(/%/,"",$3); print $3}')"

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: backend
          version: v2.13.2

  # ── Frontend: type-check + build ──────────────────────────────
  frontend:
    name: Frontend (Vue + TS)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:coverage

      - name: Coverage ratchet
        run: ../scripts/coverage-ratchet.sh frontend "$(jq .total.lines.pct coverage/coverage-summary.json)"

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_WS_URL: ""

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Backend image: binary matches each platform, runtime image builds ──
  # Skipped runs count as passing for required checks.
  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the builder stage cross-compiles via $BUILDPLATFORM/TARGETARCH.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The `docker` job on main is the only cache writer, so PRs cannot evict main's layers.
      - name: Build binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: binaries
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out
          cache-from: type=gha,scope=backend

      - name: Check binary architectures
        run: |
          scripts/check-image-arch.sh linux/amd64 out/linux_amd64/workflow-server
          scripts/check-image-arch.sh linux/arm64 out/linux_arm64/workflow-server

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend

  # ── Docker: build + push ──────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    permissions:
      contents: read
      packages: write
      # Keyless signing of the attestation (OIDC) and storing it on the repository.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push backend
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
