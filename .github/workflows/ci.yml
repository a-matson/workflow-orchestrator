name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  # Don't cancel runs on main—they publish images and must complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Workflow lint ─────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned by digest and run as a container so the job needs no Go toolchain or module cache.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/test-commit-msg.sh

  compose-check:
    name: Compose Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/check-compose.sh

  # ── Detect Changes ────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose*.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'nginx.conf'
              - 'Makefile'
              - 'scripts/**'
              - 'examples/**'
              - '.github/workflows/ci.yml'

  # ── Examples: validate JSON ───────────────────────────────────
  examples:
    name: Example Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate example JSON
        run: jq empty examples/*.json

  # ── End-to-end: full compose stack ────────────────────────────
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # Backend owns the Go cache; a second writer under the same key left main with a modules-only entry.
          cache: false

      # On Linux the socket belongs to the docker group, not root (see docker-compose.yml).
      - name: Run make e2e
        run: |
          DOCKER_SOCKET_GID="$(stat -c %g /var/run/docker.sock)"
          export DOCKER_SOCKET_GID
          make e2e

  # ── Backend: test + lint ──────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_test
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify modules
        run: go mod verify

      # Runs the untagged unit tests too; testutil migrates each test database itself.
      - name: Run integration tests
        run: go test ./... -tags=integration -race -count=1 -coverprofile=coverage.out
        env:
          FLUXOR_IT: "1"
          POSTGRES_URL: postgres://workflow:workflow@localhost:5432/workflow_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      # The integration run is a superset of the unit run, so its profile is the ratchet number.
      - name: Coverage ratchet
        run: ../scripts/coverage-ratchet.sh backend "$(go tool cover -func=coverage.out | awk 'END{gsub(/%/,"",$3); print $3}')"

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.13.2

  # ── Frontend: type-check + build ──────────────────────────────
  frontend:
    name: Frontend (Vue + TS)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:coverage

      - name: Coverage ratchet
        run: ../scripts/coverage-ratchet.sh frontend "$(jq .total.lines.pct coverage/coverage-summary.json)"

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_WS_URL: ""

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Backend image: binary matches each platform, runtime image builds ──
  # Skipped runs count as passing for required checks.
  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v6

      # No QEMU: the builder stage cross-compiles via $BUILDPLATFORM/TARGETARCH.
      - uses: docker/setup-buildx-action@v4

      # The `docker` job on main is the only cache writer, so PRs cannot evict main's layers.
      - name: Build binaries
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: binaries
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out
          cache-from: type=gha,scope=backend

      - name: Check binary architectures
        run: |
          scripts/check-image-arch.sh linux/amd64 out/linux_amd64/workflow-server
          scripts/check-image-arch.sh linux/arm64 out/linux_arm64/workflow-server

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend

  # ── Docker: build + push ──────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64,linux/arm64

  # ── Security scan ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
