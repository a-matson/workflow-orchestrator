name: Chaos

# Kills and restarts the backend 20 times during a DAG (make chaos). Too slow
# for every PR, so it runs nightly and on demand.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    name: Restarts during a DAG
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      # On Linux the socket belongs to the docker group, not root (see docker-compose.yml).
      - name: Run make chaos
        run: |
          DOCKER_SOCKET_GID="$(stat -c %g /var/run/docker.sock)"
          export DOCKER_SOCKET_GID
          make chaos
