# Included at server level AND in every location that declares its own add_header:
# nginx discards inherited add_header directives in such a location, which silently drops these.
#
# style-src 'unsafe-inline': the app sets style attributes (DAGEditor.vue) and Vue Flow injects inline styles.
# connect-src 'self': the WebSocket is same-origin (/ws, proxied); browsers match 'self' to ws(s) of the same host.
# No HSTS: served over plain HTTP here. Whatever terminates TLS in front of this should add Strict-Transport-Security.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
