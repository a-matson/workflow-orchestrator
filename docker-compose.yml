# ── Networks ──────────────────────────────────────────────────────────────────
# fluxor-internal: backend services (postgres, redis, minio, backend)
#                  NOT accessible from task containers, which run with no network.
networks:
  fluxor-internal:
    driver: bridge
    # Fixed so FLUXOR_TRUSTED_PROXIES can name it: nginx (frontend) reaches the
    # backend over this network, and without trust every client shares its IP.
    # Docker refuses overlapping networks, so stacks side by side (dev and e2e)
    # need distinct values; set FLUXOR_PROXY_IP inside the new subnet.
    ipam:
      config:
        - subnet: ${FLUXOR_INTERNAL_SUBNET:-172.29.250.0/24}
  # docker-api: backend <-> docker-proxy only. Internal: no route off the host,
  # and no other service can reach the proxy.
  docker-api:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # Task containers mount subpaths of this volume by name through the host
  # daemon, so its name must not carry the compose project prefix.
  task_workspaces:
    name: ${FLUXOR_WORKSPACE_VOLUME:-fluxor-task-workspaces}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    networks: [fluxor-internal]
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [fluxor-internal]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?set it in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env}
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    # MinIO stopped publishing images to Docker Hub and quay.io; Chainguard builds the same
    # server from source. Its free tier only serves :latest, so the digest pins it.
    image: cgr.dev/chainguard/minio:latest@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    # Root, as with the previous image: existing minio_data volumes are root-owned and the
    # image's default uid 65532 cannot open them. Non-root needs a one-time chown migration.
    user: "0:0"
    restart: unless-stopped
    networks: [fluxor-internal]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [fluxor-internal, docker-api]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_URL: postgres://workflow:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/workflow?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env}
      HTTP_ADDR: :8080
      LOG_LEVEL: info
      WORKER_COUNT: "3"
      WORKER_CONCURRENCY: "5"
      # MinIO artifact storage
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set it in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set it in .env}
      MINIO_BUCKET:     fluxor-artifacts
      MINIO_USE_SSL:    "false"
      # Task containers run on the host daemon, reached only through the
      # filtering proxy: the raw socket is root on the host.
      DOCKER_HOST:      tcp://docker-proxy:2375
      FLUXOR_WORKSPACE_ROOT:   /workspaces
      FLUXOR_WORKSPACE_VOLUME: ${FLUXOR_WORKSPACE_VOLUME:-fluxor-task-workspaces}
      FLUXOR_EGRESS_ALLOW:     ${FLUXOR_EGRESS_ALLOW:-}
      # Optional admin API key (flx_ + 43 base64url chars) installed at startup.
      FLUXOR_BOOTSTRAP_ADMIN_KEY: ${FLUXOR_BOOTSTRAP_ADMIN_KEY:-}
      # Browser session HMAC key (base64, >= 32 bytes). Empty: random per start.
      FLUXOR_SESSION_SECRET: ${FLUXOR_SESSION_SECRET:-}
      # "true" behind a TLS-terminating proxy, so the cookie is marked Secure.
      FLUXOR_COOKIE_SECURE: ${FLUXOR_COOKIE_SECURE:-false}
      # Trust nginx alone, not the subnet: the bridge gateway (every host client's
      # source address) lies inside it, and would let a client choose its own bucket.
      FLUXOR_TRUSTED_PROXIES: ${FLUXOR_TRUSTED_PROXIES:-${FLUXOR_PROXY_IP:-172.29.250.10}/32}
      FLUXOR_RATE_LIMIT_PER_MIN: ${FLUXOR_RATE_LIMIT_PER_MIN:-200}
      FLUXOR_LOGIN_RATE_LIMIT_PER_MIN: ${FLUXOR_LOGIN_RATE_LIMIT_PER_MIN:-10}
    volumes:
      - task_workspaces:/workspaces
    depends_on:
      docker-proxy: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    # Readiness, not liveness: the frontend waits on this, so it starts only once
    # Postgres, Redis and MinIO answer. Restart policy is unaffected by health.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Allows only the Docker API calls ContainerExecutor makes (see README, Security).
  # It narrows the API, it does not make it safe: POST /containers/create can
  # still bind-mount any host path, so a compromised backend still owns the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    networks: [docker-api]
    environment:
      # On by default in the image; the executor never calls them.
      EVENTS: "0"
      VERSION: "0"
      # /_ping: API version negotiation for the volume-subpath gate.
      PING: "1"
      # create, start, wait, logs, kill, and DELETE for remove.
      CONTAINERS: "1"
      # inspect, and POST /images/create for pull.
      IMAGES: "1"
      # Every non-GET method; the path rules above still apply.
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket's owning group differs by host: 0 on Docker Desktop, usually
    # the `docker` group on Linux (`stat -c %g /var/run/docker.sock`).
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: {context: ./frontend}
    restart: unless-stopped
    # Fixed address: the backend trusts X-Forwarded-For from this one peer.
    networks:
      fluxor-internal:
        ipv4_address: ${FLUXOR_PROXY_IP:-172.29.250.10}
    ports: ["127.0.0.1:3000:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      backend: {condition: service_healthy}

  redis-commander:
    image: rediscommander/redis-commander:latest
    networks: [fluxor-internal]
    environment:
      REDIS_HOSTS: "fluxor:redis:6379:0:${REDIS_PASSWORD:?set it in .env}"
    ports: ["127.0.0.1:8081:8081"]
    depends_on: [redis]
    profiles: [tools]
