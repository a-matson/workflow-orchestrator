# Throwaway infrastructure for `make test-integration`. No volumes: data lives
# in tmpfs so every `up` starts empty. Ports differ from docker-compose.yml so
# both stacks can run side by side.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    # Matches production: the broker refuses evicting policies.
    command: redis-server --save "" --appendonly no --maxmemory-policy noeviction
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
